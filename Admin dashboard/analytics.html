<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analytics - Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
  <!-- Top navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <!-- Offcanvas toggler for small screens -->
      <button class="btn btn-dark d-md-none me-2" type="button" data-bs-toggle="offcanvas"
        data-bs-target="#offcanvasSidebar" aria-controls="#offcanvasSidebar">
        <i class="bi bi-list fs-3"></i>
      </button>

      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <i class="bi bi-speedometer2 me-2"></i>
        AdminDash
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topnav"
        aria-controls="topnav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="topnav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item me-3">
            <a class="nav-link" href="#"><i class="bi bi-bell"></i></a>
          </li>
          <li class="nav-item me-2">
            <button id="themeToggle" class="btn btn-outline-light btn-sm d-flex align-items-center" type="button"
              title="Toggle theme">
              <i id="themeIcon" class="bi bi-moon"></i>
            </button>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userMenu" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">
              <img src="https://via.placeholder.com/32" class="rounded-circle me-2" alt="user">
              <span class="d-none d-sm-inline">Admin</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
              <li><a class="dropdown-item" href="#">Profile</a></li>
              <li><a class="dropdown-item" href="#">Settings</a></li>
              <li>
                <hr class="dropdown-divider">
              </li>
              <li><a class="dropdown-item" href="#">Sign out</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Offcanvas sidebar (small screens) -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasSidebarLabel">Menu</h5>
      <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0">
      <nav class="nav flex-column sidebar-nav">
        <a class="nav-link" href="index.html"><i class="bi bi-house-door me-2"></i> Dashboard</a>
        <a class="nav-link" href="users.html"><i class="bi bi-people me-2"></i> Users</a>
        <a class="nav-link active" href="analytics.html"><i class="bi bi-graph-up me-2"></i> Analytics</a>
        <a class="nav-link" href="settings.html"><i class="bi bi-gear me-2"></i> Settings</a>
        <a class="nav-link mt-auto" href="help.html"><i class="bi bi-life-preserver me-2"></i> Help & docs</a>
      </nav>
    </div>
  </div>
  <div class="container-fluid">
    <div class="row">
      <nav id="sidebar" class="col-md-3 col-lg-2 d-none d-md-block bg-light sidebar py-3">
        <div class="position-sticky">
          <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house-door me-2"></i>
                Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="users.html"><i class="bi bi-people me-2"></i> Users</a></li>
            <li class="nav-item"><a class="nav-link active" href="analytics.html"><i class="bi bi-graph-up me-2"></i>
                Analytics</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="bi bi-gear me-2"></i> Settings</a>
            </li>
            <li class="nav-item mt-3"><a class="nav-link text-muted small" href="help.html"><i
                  class="bi bi-life-preserver me-2"></i> Help & docs</a></li>
          </ul>
        </div>
      </nav>
      <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
        <div class="d-flex justify-content-between flex-wrap align-items-center mb-3">
          <h1 class="h2 animate__animated animate__fadeInDown">Analytics</h1>
        </div>
        <div class="card shadow-sm mb-4 animate__animated animate__fadeInUp">
          <div class="card-body">
            <h5 class="card-title">Site Analytics</h5>
            <canvas id="analyticsChart" height="120"></canvas>
          </div>
        </div>
        <footer class="text-muted small">&copy; <span id="year"></span> AdminDash — Example dashboard built with
          Bootstrap</footer>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    window.addEventListener('DOMContentLoaded', function () {
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'],
          datasets: [{
            label: 'Visits',
            data: [3200, 4100, 3700, 5200, 4800, 5400, 6300],
            backgroundColor: 'rgba(13, 110, 253, 0.7)',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
          },
          animation: {
            duration: 1200,
            easing: 'easeOutQuart'
          },
          scales: {
            y: { beginAtZero: true }
          }
        }
      });
    });
  </script>
</body>

</html>
